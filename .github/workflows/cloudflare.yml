name: Cloudflare

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # sticky preview-URL comment on PRs

env:
  CF_SEND_TELEMETRY: "false"

jobs:
  build:
    name: Check, build and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npx cf build
      - name: Validate build (no credentials needed)
        run: npx cf deploy --prebuilt --mode production --dry-run

      # Pull requests from this repo get a Worker Preview URL (forks have no secrets, so they stop at the dry run).
      - name: Deploy PR preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # `shell: bash` adds -o pipefail, so a failed deploy is not masked by `tee` succeeding.
        # No --prebuilt: previews need a Preview build, which `cf previews deploy` makes itself.
        shell: bash
        run: |
          npx cf previews deploy 2>&1 | tee preview.log
          {
            echo "### Cloudflare preview"
            echo '```'
            grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' preview.log | sort -u || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URLs on the PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/preview-comment.sh preview.log

      - name: Deploy production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx cf deploy --prebuilt --mode production
